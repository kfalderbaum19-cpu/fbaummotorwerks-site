<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | F-Baum Motorwerks</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <div class="brand">
            <a href="index.html">F-BAUM MOTORWERKS</a>
        </div>

        <nav>
            <a href="index.html#about">About</a>
            <a href="index.html#products">Coming Soon</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>

        <section class="contact-page">

            <div class="contact-heading">
                <p class="eyebrow">GET IN TOUCH</p>

                <h1>Let’s talk.</h1>

                <p>
                    Have a question about upcoming products, fitment,
                    collaborations, or anything else F-Baum related?
                    Send a message below.
                </p>
            </div>

            <form
                class="contact-form"
                action="https://formspree.io/f/xzezdzdv"
                method="POST"
            >

                <div class="form-group">
                    <label for="name">Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Your name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="subject">Message Type</label>

                    <select
                        id="subject"
                        name="subject"
                    >
                        <option value="General Inquiry">General Inquiry</option>
                        <option value="Product Question">Product Question</option>
                        <option value="Fitment Question">Fitment Question</option>
                        <option value="Collaboration">Collaboration</option>
                        <option value="Wholesale / Business">Wholesale / Business</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="7"
                        placeholder="What can we help you with?"
                        required
                    ></textarea>
                </div>

                <button type="submit" class="button primary">
                    Send Message
                </button>

            </form>

            <div class="direct-email">
                <p>Prefer email?</p>

                <a href="mailto:fbaummotorwerks@gmail.com">
                    fbaummotorwerks@gmail.com
                </a>
            </div>

        </section>

    </main>

</body>
</html>
